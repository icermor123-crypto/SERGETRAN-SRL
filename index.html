else if(v=="panel"){const T=[];if(can(["logistica","taller","administrador","desarrollo"]))T.push(["ord","Pedidos"]);if(can(["vendedor","administrador","desarrollo"]))T.push(["cat","Catálogo"],["ban","Promociones"]);if(can(["administrador","desarrollo"]))T.push(["usr","Usuarios"]);
if(!T.some(t=>t[0]==ptab))ptab=T[0][0];const tb=`<div class="chips">${T.map(([k,l])=>`<button class="chip ${ptab==k?"on":""}" onclick="ptab='${k}';edit=null;ebn=null;render()">${l}</button>`).join("")}</div>`;a.innerHTML=tb+'<div class="empty">Cargando...</div>';let h="";
if(ptab=="ord"){const r=await sb.from("orders").select("*,order_items(*)").order("created_at",{ascending:false}).limit(100);OL=r.data||[];h=OL.map(o=>`<div class="card">${oc(o)}<select onchange="setSt(${o.id},this.value)">${ST.map(s=>`<option ${o.status==s?"selected":""}>${s}</option>`).join("")}</select><button class="btn ghost" onclick="wc(${o.id})">💬 Escribir al cliente</button></div>`).join("")||'<div class="empty">No hay pedidos.</div>'}
else if(ptab=="cat"){const e=edit||{};h=`<div class="card"><label>Nueva categoría</label><div class="row"><input id="cn" placeholder="Ej: Filtros" style="margin:0"><input id="ci" placeholder="🔩" style="width:70px;margin:0"><button class="btn" onclick="addCat()">Añadir</button></div></div>
<div class="card"><b>${e.id?"Editar producto":"Nuevo producto"}</b><input type="hidden" id="pid" value="${e.id||""}"><label style="margin-top:8px">Nombre</label><input id="pn" value="${esc(e.name)}"><label>Marca</label><input id="pb" value="${esc(e.brand)}"><label>Presentación</label><input id="pp" value="${esc(e.presentation)}" placeholder="5 litros"><label>Precio USD (vacío = consultar)</label><input id="pr" type="number" step="0.01" value="${e.price??""}"><label>Precio de oferta USD (vacío = sin oferta)</label><input id="po" type="number" step="0.01" value="${e.promo_price??""}"><label>Etiqueta de la oferta</label><input id="pl" value="${esc(e.promo_label)}" placeholder="Ej: -20% o 2x1"><label>Categoría</label><select id="pc">${cats.map(c=>`<option value="${c.id}" ${e.category_id==c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select><label>Descripción</label><textarea id="pd" rows="3">${esc(e.description)}</textarea><label>Características (separadas por coma)</label><input id="pf" value="${esc((e.features||[]).join(", "))}"><label><input type="checkbox" id="ps" style="width:auto;margin-right:6px" ${e.is_service?"checked":""}>Es un servicio (con cita)</label><label>Foto (cuadrada, fondo blanco)</label><input id="pi" type="file" accept="image/*"><button class="btn big" onclick="saveP()">Guardar producto</button>${e.id?'<button class="btn ghost big" onclick="edit=null;render()">Cancelar</button>':""}</div>
${prods.map(x=>`<div class="card row"><div><b style="font-size:13px">${esc(x.name)}</b><br><small>${pz(x)} · ${x.active?"Visible":"Oculto"} · ${x.in_stock?"Disponible":"Agotado"}</small></div><div><button class="btn ghost" onclick="edit=pid(${x.id});render();scrollTo(0,0)">Editar</button><button class="btn ghost" onclick="tgl(${x.id},'in_stock')">${x.in_stock?"Agotar":"Reponer"}</button><button class="btn ghost" onclick="tgl(${x.id},'active')">${x.active?"Ocultar":"Mostrar"}</button></div></div>`).join("")}`}
else if(ptab=="ban"){const e=ebn||{};h=`<div class="card"><b>${e.id?"Editar promoción":"Nueva promoción / banner"}</b><input type="hidden" id="bid" value="${e.id||""}"><label style="margin-top:8px">Título</label><input id="bt" value="${esc(e.title)}" placeholder="Ej: Aceite diésel en oferta"><label>Texto corto</label><input id="bs" value="${esc(e.subtitle)}"><label>Imagen (horizontal, ej. 1200×500)</label><input id="bi" type="file" accept="image/*"><label>Al tocarlo lleva a</label><select id="bl"><option value="">Nada</option>${cats.map(c=>`<option value="c${c.id}" ${e.link_category==c.id?"selected":""}>Categoría: ${esc(c.name)}</option>`).join("")}${prods.map(p=>`<option value="p${p.id}" ${e.link_product==p.id?"selected":""}>Producto: ${esc(p.name)}</option>`).join("")}</select><button class="btn big" onclick="saveB()">Guardar</button>${e.id?'<button class="btn ghost big" onclick="ebn=null;render()">Cancelar</button>':""}</div>`+bans.map(x=>`<div class="card row"><div><b style="font-size:13px">${esc(x.title)}</b><br><small>${x.active?"Visible":"Oculto"}</small></div><div><button class="btn ghost" onclick="ebn=bans.find(z=>z.id==${x.id});render();scrollTo(0,0)">Editar</button><button class="btn ghost" onclick="tglB(${x.id})">${x.active?"Ocultar":"Mostrar"}</button><button class="btn ghost" onclick="delB(${x.id})">Borrar</button></div></div>`).join("")+'<p class="empty">Las ofertas de precio se ponen en cada producto (pestaña Catálogo).</p>'}
else{const r=await sb.from("profiles").select("*").order("created_at",{ascending:false});h=(r.data||[]).map(p=>`<div class="card row"><div><b style="font-size:13px">${esc(p.full_name)||"Sin nombre"}</b><br><small>${esc(p.phone)}</small></div><select style="width:150px;margin:0" onchange="setRole('${p.id}',this.value)">${ROLES.map(x=>`<option ${p.role==x?"selected":""}>${x}</option>`).join("")}</select></div>`).join("")+'<p class="empty">Para dar un rol al personal: que se registre en la app y aquí le asignas el rol.</p>'}
a.innerHTML=tb+h}}
async function doAuth(){const e=$("#em").value.trim(),p=$("#pw").value;let r;if(am=="reg")r=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:$("#fn").value,phone:$("#ph").value}}});else r=await sb.auth.signInWithPassword({email:e,password:p});
if(r.error)return alert(r.error.message);if(!r.data.session){msg="Revisa tu correo para confirmar la cuenta y luego inicia sesión.";am="login";return render()}
msg="";await who();go(cnt()?"cart":"home")}
async function saveProf(){const r=await sb.from("profiles").update({full_name:$("#fn").value,phone:$("#ph").value}).eq("id",U.id);if(r.error)return alert(r.error.message);await who();alert("Guardado")}
async function send(){if(!U){msg="Inicia sesión para enviar tu solicitud";am="login";return go("auth")}
const g=i=>($(i)||{}).value||"",nm=g("#nm").trim(),tl=g("#tl").trim();
if(!nm||!tl)return alert("Escribe tu nombre y teléfono");if(mode=="domicilio"&&!g("#ad").trim())return alert("Escribe la dirección de entrega");if(mode!="domicilio"&&!g("#dt"))return alert("Elige el día");if(mode=="servicio"&&!g("#vh").trim())return alert("Indica tu vehículo");
const o=await sb.from("orders").insert({user_id:U.id,mode,customer_name:nm,customer_phone:tl,address:g("#ad")||null,scheduled_at:mode!="domicilio"?new Date(g("#dt")+"T"+g("#hr")+":00").toISOString():null,vehicle:g("#vh")||null,notes:g("#nt")||null}).select().single();
if(o.error)return alert(o.error.message);
const r=await sb.from("order_items").insert(Object.entries(cart).filter(([i])=>pid(i)).map(([i,n])=>({order_id:o.data.id,product_id:+i,qty:n})));if(r.error)return alert(r.error.message);
const t=await sb.from("orders").select("*,order_items(*)").eq("id",o.data.id).single();cart={};sc();done=t.data;render();wa(done)}
function wa(o,c){const t=`*SERGETRAN SRL · Pedido #${o.id}*\n${MODES[o.mode][0]}\n\n${(o.order_items||[]).map(i=>`• ${i.name} ×${i.qty}`).join("\n")}\n\nTotal estimado: $${o.total} USD\nNombre: ${o.customer_name}\nTeléfono: ${o.customer_phone}`+(o.address?`\nDirección: ${o.address}`:"")+(o.scheduled_at?`\nFecha: ${new Date(o.scheduled_at).toLocaleString("es")}`:"")+(o.vehicle?`\nVehículo: ${o.vehicle}`:"")+(o.notes?`\nNotas: ${o.notes}`:"");
window.open(`https://wa.me/${c?o.customer_phone.replace(/\D/g,""):WA}?text=${encodeURIComponent(c?`Hola ${o.customer_name}, le escribimos de SERGETRAN SRL sobre su pedido #${o.id}: ${o.status}.`:t)}`,"_blank")}
const wc=id=>wa(OL.find(o=>o.id==id),1);
async function setSt(id,s){const r=await sb.from("orders").update({status:s}).eq("id",id);if(r.error)alert(r.error.message)}
async function setRole(id,r0){const r=await sb.from("profiles").update({role:r0}).eq("id",id);if(r.error)alert(r.error.message)}
async function addCat(){const n=$("#cn").value.trim();if(!n)return;const r=await sb.from("categories").insert({name:n,icon:$("#ci").value||"📦",sort:cats.length+1});if(r.error)return alert(r.error.message);await load();render()}
async function tgl(id,k){const x=pid(id),r=await sb.from("products").update({[k]:!x[k]}).eq("id",id);if(r.error)return alert(r.error.message);await load();render()}
function upImg(file,mx=800,fd="p"){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(async b=>{const p=fd+"/"+Date.now()+".webp",r=await sb.storage.from("product-images").upload(p,b,{contentType:"image/webp"});if(r.error)return no(r.error);ok(sb.storage.from("product-images").getPublicUrl(p).data.publicUrl)},"image/webp",.82)};i.onerror=no;i.src=URL.createObjectURL(file)})}
async function saveP(){const f=i=>$("#"+i).value,o={name:f("pn").trim(),brand:f("pb"),presentation:f("pp"),price:f("pr")?+f("pr"):null,promo_price:f("po")?+f("po"):null,promo_label:f("pl")||null,category_id:+f("pc")||null,description:f("pd"),features:f("pf").split(",").map(s=>s.trim()).filter(Boolean),is_service:$("#ps").checked};
if(!o.name)return alert("Falta el nombre");try{const fl=$("#pi").files[0];if(fl)o.image_url=await upImg(fl)}catch(e){return alert("No se pudo subir la foto: "+(e.message||e))}
const id=f("pid"),r=id?await sb.from("products").update(o).eq("id",id):await sb.from("products").insert(o);if(r.error)return alert(r.error.message);edit=null;await load();render();scrollTo(0,0)}
async function saveB(){const f=i=>$("#"+i).value,l=f("bl"),o={title:f("bt").trim(),subtitle:f("bs"),link_category:l[0]=="c"?+l.slice(1):null,link_product:l[0]=="p"?+l.slice(1):null};
if(!o.title)return alert("Falta el título");try{const fl=$("#bi").files[0];if(fl)o.image_url=await upImg(fl,1400,"banners")}catch(e){return alert("No se pudo subir la imagen: "+(e.message||e))}
const id=f("bid"),r=id?await sb.from("banners").update(o).eq("id",id):await sb.from("banners").insert({...o,sort:bans.length+1});if(r.error)return alert(r.error.message);ebn=null;await load();render();scrollTo(0,0)}
async function tglB(id){const b=bans.find(x=>x.id==id),r=await sb.from("banners").update({active:!b.active}).eq("id",id);if(r.error)return alert(r.error.message);await load();render()}
async function delB(id){if(!confirm("¿Borrar esta promoción?"))return;const r=await sb.from("banners").delete().eq("id",id);if(r.error)return alert(r.error.message);await load();render()}
setInterval(()=>{const b=$("#bn");if(b&&b.children.length>1)b.scrollTo({left:(Math.round(b.scrollLeft/b.clientWidth)+1)%b.children.length*b.clientWidth,behavior:"smooth"})},4500);
(async()=>{await Promise.all([load(),who()]);render()})();
</script></body></html>
